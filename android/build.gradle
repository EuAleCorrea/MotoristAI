// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext.kotlin_version = '2.1.0'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:2.1.0"

            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'io.netty') {
                    details.useVersion '4.1.119.Final'
                }
                if (details.requested.group == 'org.bouncycastle') {
                    details.useVersion '1.80'
                }
                if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
                    details.useVersion '3.17.0'
                }
                if (details.requested.group == 'org.apache.httpcomponents' && details.requested.name == 'httpclient') {
                    details.useVersion '4.5.14'
                }
            }
        }
    }
}

// Prevent sub-project buildscripts from re-applying kotlin-android plugin
// when it's already applied by AGP 9 (which registers the 'kotlin' extension internally)
subprojects {
    buildscript {
        configurations.classpath {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
