apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.motoristai.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.motoristai.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        compose true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // Apenas o pacote core. Os icones que nao existem nele sao vetores proprios
    // em ui/icons/MotoristAIIcons.kt, evitando o custo do material-icons-extended.
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // Testes instrumentados de interface (Compose UI Test) usados pela demonstração da Home
    androidTestImplementation platform('androidx.compose:compose-bom:2025.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation project(':capacitor-cordova-android-plugins')
}

configurations.all {
    resolutionStrategy {
        // Apache Commons Lang3 3.17.0 corrige CVE-2024-47554 (Uncontrolled Recursion)
        force "org.apache.commons:commons-lang3:3.17.0"
        // Bouncy Castle 1.79 corrige vulnerabilidades: Timing Attack, LDAP Injection, Broken/Risky Crypto
        force "org.bouncycastle:bcprov-jdk18on:1.79"
        // Bouncy Castle PKIX 1.79 corrige Improper Verification of Cryptographic Signature
        force "org.bouncycastle:bcpkix-jdk18on:1.79"
        // Netty 4.1.119.Final - versão corrigida para vulnerabilidades Snyk
        force "io.netty:netty-handler:4.1.119.Final"
        force "io.netty:netty-handler-proxy:4.1.119.Final"
        force "io.netty:netty-codec-http:4.1.119.Final"
        force "io.netty:netty-codec-http2:4.1.119.Final"
        force "io.netty:netty-codec:4.1.119.Final"
        force "io.netty:netty-transport-native-unix-common:4.1.119.Final"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
